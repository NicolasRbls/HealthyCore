# docker-compose.prod.yml
# This file is for production deployment.
# It defines the services needed to run the application on a server.
# To use it, run: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres
    container_name: postgres_healthycore_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - healthycore_network

  backend:
    build: .
    container_name: backend_healthycore_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      ADMIN_PRENOM: ${ADMIN_PRENOM}
      ADMIN_NOM: ${ADMIN_NOM}
      ADMIN_SEXE: ${ADMIN_SEXE}
      ADMIN_DATE_DE_NAISSANCE: ${ADMIN_DATE_DE_NAISSANCE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      API_URL: ${API_URL}
    depends_on:
      - postgres
    networks:
      - healthycore_network

networks:
  healthycore_network:

volumes:
  postgres_data:
